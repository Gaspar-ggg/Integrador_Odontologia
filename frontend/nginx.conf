server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index frontend/public/index.html;

    # Redirección de la raíz al portal público
    location = / {
        return 302 /frontend/public/index.html;
    }

    # Servir archivos estáticos del frontend y design-system
    location / {
        try_files $uri $uri/ =404;
    }

    # Proxy inverso para las APIs del backend Spring Boot
    location /api/v1/ {
        proxy_pass http://backend:8080/api/v1/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
