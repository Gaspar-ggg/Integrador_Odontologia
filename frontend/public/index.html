<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="La Muelita Cuyana — Gestión odontológica y reserva de turnos online.">
  <title>La Muelita Cuyana</title>
  <link rel="stylesheet" href="../../design-system/tokens.css">
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      padding: var(--space-6) var(--space-4);
      font-family: var(--font-family-base);
      font-size: var(--font-size-base);
      line-height: var(--line-height-normal);
      color: var(--color-text-primary);
      background-color: var(--color-surface-bg);
    }

    .shell {
      max-width: 60rem;
      margin: 0 auto;
    }

    .header {
      display: flex;
      align-items: center;
      padding-bottom: var(--space-5);
      margin-bottom: var(--space-8);
      border-bottom: 1px solid var(--color-border-subtle);
    }

    .header img {
      display: block;
      width: 100%;
      max-width: 13.75rem;
      height: auto;
    }

    .card {
      max-width: 40rem;
      padding: var(--space-8);
      background-color: var(--color-surface-card);
      border: 1px solid var(--color-border-subtle);
      border-radius: var(--radius-xl);
      box-shadow: var(--shadow-md);
    }

    .eyebrow {
      margin: 0 0 var(--space-2);
      font-size: var(--font-size-sm);
      font-weight: var(--font-weight-semibold);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--color-primary-700);
    }

    h1 {
      margin: 0 0 var(--space-3);
      font-size: var(--font-size-3xl);
      line-height: var(--line-height-tight);
    }

    .lead {
      margin: 0;
      color: var(--color-text-secondary);
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: var(--space-3);
      margin-top: var(--space-6);
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: var(--space-3) var(--space-5);
      font-size: var(--font-size-base);
      font-weight: var(--font-weight-semibold);
      line-height: var(--line-height-tight);
      text-decoration: none;
      border: 1px solid transparent;
      border-radius: var(--radius-md);
      cursor: pointer;
      transition:
        background-color var(--transition-fast),
        border-color var(--transition-fast),
        box-shadow var(--transition-fast);
    }

    .btn:focus-visible {
      outline: none;
      box-shadow: var(--shadow-focus);
    }

    .btn--primary {
      color: var(--color-text-inverse);
      background-color: var(--color-primary-600);
    }

    .btn--primary:hover {
      background-color: var(--color-primary-700);
    }

    .btn--secondary {
      color: var(--color-text-secondary);
      background-color: var(--color-surface-card);
      border-color: var(--color-border-strong);
    }

    .btn--secondary:hover {
      color: var(--color-text-primary);
      background-color: var(--color-surface-subtle);
    }

    @media (max-width: 520px) {
      body {
        padding: var(--space-4) var(--space-3);
      }

      .card {
        padding: var(--space-5);
      }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header class="header">
      <img src="../../design-system/assets/logo.svg" alt="La Muelita Cuyana" width="220" height="50">
    </header>

    <main id="app">
      <section class="card" aria-labelledby="welcome-title">
        <p class="eyebrow" data-brand-tagline>Consultorio y Gestión Odontológica</p>
        <h1 id="welcome-title">Sistema odontológico</h1>
        <p class="lead">Entorno de frontend inicializado correctamente con TypeScript vanilla y tokens de diseño.</p>
        <div class="actions">
          <a class="btn btn--primary" href="login.html">Ingresar</a>
          <a class="btn btn--secondary" href="registro.html">Crear cuenta</a>
        </div>
      </section>
    </main>
  </div>

  <!-- brand.js es un módulo ES: debe cargarse con type="module" -->
  <script type="module" src="../../design-system/brand.js"></script>
  <script type="module" src="../dist/index.js"></script>
</body>
</html>
