<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 64" width="280" height="64" fill="none">
  <!-- Minimalist Clean Container -->
  <rect width="280" height="64" rx="10" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>

  <!-- Minimalist Monoline Continuous Tooth Isotype -->
  <g transform="translate(18, 14)">
    <!-- Continuous single-line elegant tooth silhouette -->
    <path d="M18 6
             C13 6 8 8 7 14
             C6 19 8 23 10 27
             C12 31 13 35 15 35
             C17 35 18 31 19 26
             C19.5 23 20.5 23 21 26
             C22 31 23 35 25 35
             C27 35 28 31 30 27
             C32 23 34 19 33 14
             C32 8 27 6 22 6
             C20.5 6 19.5 7 18 7
             C16.5 7 15.5 6 18 6Z" 
          fill="none" 
          stroke="#0284C7" 
          stroke-width="2.2" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>
    
    <!-- Minimalist subtle shine / dental accent -->
    <path d="M12 11C11 13 11 15 12 17" 
          stroke="#38BDF8" 
          stroke-width="1.8" 
          stroke-linecap="round"/>
  </g>

  <!-- Typography -->
  <text x="64" y="30" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600" fill="#0F172A" letter-spacing="-0.3">La Muelita Cuyana</text>
  <text x="64" y="46" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="500" fill="#0369A1" letter-spacing="1.5">CONSULTORIO ODONTOLÓGICO</text>
</svg>
